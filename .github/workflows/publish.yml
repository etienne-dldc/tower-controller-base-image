name: Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
  workflow_dispatch:

env:
  VERSION: "1.1.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LC}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        if: github.event_name != 'pull_request'
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}:${VERSION}" > /dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already published; skipping push."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not published yet; will build and push."
          fi

      - name: Build and push
        if: github.event_name == 'pull_request' || steps.check.outputs.already_published != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.VERSION }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
