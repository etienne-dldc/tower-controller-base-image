name: Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
  workflow_dispatch:

env:
  DENO_VERSION: "2.9.1"
  DOCKER_CLI_VERSION: "29.6.1"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LC}"
          VERSION_TAG="deno-${DENO_VERSION}-dockercli-${DOCKER_CLI_VERSION}"
          {
            echo "image=${IMAGE}"
            echo "version_tag=${VERSION_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            DENO_VERSION=${{ env.DENO_VERSION }}
            DOCKER_CLI_VERSION=${{ env.DOCKER_CLI_VERSION }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
